# One entry point: http://learning-app.local/ → the frontend Service. Needs the ingress addon (lesson 20).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learning-app
  namespace: learning-app
  labels:
    app.kubernetes.io/part-of: learning-app
spec:
  ingressClassName: nginx
  rules:
    - host: learning-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
