# One identity per component (lesson 23). None of them needs the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend, namespace: learning-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: backend, namespace: learning-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: db, namespace: learning-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: backup, namespace: learning-app}
automountServiceAccountToken: false
