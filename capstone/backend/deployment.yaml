# The backend API: two replicas behind the "backend" Service, rolled out one Pod at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: learning-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: learning-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: learning-app
        tier: backend
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # the image's "nonroot" user, as a number: the kubelet can only verify numeric users
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: learning-app/backend:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-credentials, key: username}
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: db-credentials, key: database}
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db/password
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets/db
              readOnly: true
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3          # /readyz pings the database for up to 2 s; the default timeout is 1 s
            failureThreshold: 2
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: credentials
          secret:
            secretName: db-credentials
            items:
              - key: password
                path: password
