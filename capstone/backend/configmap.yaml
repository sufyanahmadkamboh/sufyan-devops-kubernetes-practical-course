# Non-secret configuration of the backend, injected as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: learning-app
  labels:
    app.kubernetes.io/part-of: learning-app
data:
  MESSAGE: "Hello from the capstone"
  LOG_LEVEL: "info"
  DB_HOST: "db"
  DB_PORT: "5432"
