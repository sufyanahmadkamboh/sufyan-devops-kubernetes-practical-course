# The database password. In a real project it would come from a secret manager, never from a file in Git;
# this example value exists only so the capstone runs out of the box. Lesson 12 explains why base64 is not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: learning-app
  labels:
    app.kubernetes.io/part-of: learning-app
type: Opaque
stringData:
  username: app
  password: example-password-change-me
  database: app
