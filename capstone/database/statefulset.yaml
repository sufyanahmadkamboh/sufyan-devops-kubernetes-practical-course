# PostgreSQL 18 with its data on a PersistentVolumeClaim created from the volumeClaimTemplate:
# the data survives the Pod being deleted, rescheduled or updated.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: learning-app
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: learning-app
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: learning-app
        tier: database
    spec:
      serviceAccountName: db
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: db-credentials, key: username}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: db-credentials, key: database}
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db/password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: credentials
              mountPath: /run/secrets/db
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: credentials
          secret:
            secretName: db-credentials
            items:
              - key: password
                path: password
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: db
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
