<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="hpa"><rect width="1000" height="320" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Horizontal Pod Autoscaler</text><rect x="40" y="120" width="190" height="80" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="135.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">metrics-server</text><text x="135.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">CPU per Pod</text><rect x="320" y="120" width="210" height="80" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="425.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">HPA backend</text><text x="425.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">target 60% CPU, 2–5</text><rect x="620" y="120" width="180" height="80" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="710.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">Deployment</text><text x="710.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">replicas: 2 → 5</text><defs><marker id="a11" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="232" y1="160" x2="318" y2="160" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a11)"/><defs><marker id="a13" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="532" y1="160" x2="618" y2="160" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a13)"/><text x="575.0" y="151.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">scale</text><text x="500" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">desired = ceil(current × currentCPU / targetCPU) · scale-down waits a stabilization window</text></svg>
