<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="rbac"><rect width="1000" height="320" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">RBAC: who may do what</text><rect x="40" y="120" width="190" height="80" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="135.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">User developer</text><text x="135.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">or a ServiceAccount</text><rect x="380" y="120" width="230" height="80" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="495.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">RoleBinding</text><text x="495.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">in namespace learning-app</text><rect x="760" y="120" width="200" height="80" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="860.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">Role app-viewer</text><text x="860.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">get, list, watch pods…</text><defs><marker id="a11" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="232" y1="160" x2="378" y2="160" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a11)"/><text x="305.0" y="151.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">subject</text><defs><marker id="a14" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="612" y1="160" x2="758" y2="160" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a14)"/><text x="685.0" y="151.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">roleRef</text><text x="500" y="270" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">kubectl auth can-i delete pods --as developer  →  no</text></svg>
