<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="configuration"><rect width="1000" height="330" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">ConfigMaps and Secrets: configuration outside the image</text><rect x="40" y="80" width="230" height="75" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="155.0" y="111.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">ConfigMap</text><text x="155.0" y="132.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">LOG_LEVEL, nginx.conf</text><rect x="40" y="190" width="230" height="75" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="2"/><text x="155.0" y="221.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">Secret</text><text x="155.0" y="242.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">password (base64, not encrypted)</text><rect x="600" y="120" width="330" height="110" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="765.0" y="169.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">Pod</text><text x="765.0" y="190.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">env: LOG_LEVEL=info · file: /run/secrets/db/password</text><defs><marker id="a11" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="272" y1="118" x2="598" y2="160" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a11)"/><text x="435.0" y="130.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">as environment variables</text><defs><marker id="a14" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="272" y1="228" x2="598" y2="195" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a14)"/><text x="435.0" y="231.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">as files (volume)</text></svg>
