<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="pod"><rect width="1000" height="360" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">A Pod: containers sharing network and storage</text><rect x="200" y="70" width="600" height="260" rx="12" fill="none" stroke="#1d63ed" stroke-width="1.8" stroke-dasharray="7 5"/><text x="212" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d63ed" text-anchor="start" xml:space="preserve">Pod web (IP 10.244.0.12)</text><rect x="240" y="110" width="230" height="80" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="355.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">app container</text><text x="355.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">listens on :8080</text><rect x="530" y="110" width="230" height="80" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="645.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">sidecar container</text><text x="645.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">reads the app's logs</text><rect x="240" y="220" width="520" height="45" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="500.0" y="247.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">shared network: localhost between the containers</text><rect x="240" y="275" width="520" height="45" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="500.0" y="302.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">shared volume (emptyDir): /var/log/app</text><text x="500" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">one IP per Pod · containers start and stop together · Pods are replaceable</text></svg>
