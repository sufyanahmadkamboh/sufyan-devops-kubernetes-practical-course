<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="storage"><rect width="1000" height="340" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Storage: PV ← PVC ← Pod</text><rect x="40" y="130" width="170" height="75" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="125.0" y="161.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">Pod db-0</text><text x="125.0" y="182.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">mounts the claim</text><rect x="280" y="130" width="200" height="75" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="380.0" y="161.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">PVC data-db-0</text><text x="380.0" y="182.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">1Gi, ReadWriteOnce</text><rect x="560" y="130" width="190" height="75" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="655.0" y="161.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">PV pvc-…</text><text x="655.0" y="182.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">the actual storage</text><rect x="800" y="130" width="170" height="75" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="885.0" y="161.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">StorageClass</text><text x="885.0" y="182.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">standard (provisioner)</text><defs><marker id="a14" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="212" y1="168" x2="278" y2="168" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a14)"/><text x="245.0" y="159.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">uses</text><defs><marker id="a17" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="482" y1="168" x2="558" y2="168" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a17)"/><text x="520.0" y="159.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">bound</text><defs><marker id="a20" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="798" y1="168" x2="752" y2="168" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a20)"/><text x="775.0" y="188.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">creates</text><text x="500" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">the Pod can be deleted, rescheduled or updated: the data stays on the PV</text></svg>
