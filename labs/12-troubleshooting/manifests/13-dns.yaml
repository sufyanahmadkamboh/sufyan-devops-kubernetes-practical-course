# Problem 13: a backend in the namespace trouble-13. The lab calls it from a client in another namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: trouble-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: learning-app/backend:1.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: trouble-13
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
