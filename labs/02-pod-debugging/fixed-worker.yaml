# Lab 02: the worker with its setting.
apiVersion: v1
kind: Pod
metadata:
  name: shop-worker
spec:
  containers:
    - name: worker
      image: busybox:1.37
      command: ["sh", "-c", "if [ -z \"$APP_MODE\" ]; then echo 'ERROR: APP_MODE is not set'; exit 1; fi; echo \"worker running in $APP_MODE mode\"; sleep 3600"]
      env:
        - name: APP_MODE
          value: production
