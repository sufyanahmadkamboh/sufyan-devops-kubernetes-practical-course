# Challenge 07 solution: the cache accepts connections from Pods labelled app=api only, on port 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cache-from-api-only
spec:
  podSelector:
    matchLabels:
      app: cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 80
