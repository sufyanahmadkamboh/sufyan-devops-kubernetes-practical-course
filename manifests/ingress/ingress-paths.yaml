# Path-based routing: one host name, the path decides. /api/... goes to the backend, everything else to the frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: by-path
spec:
  ingressClassName: nginx
  rules:
    - host: shop.local
      http:
        paths:
          - path: /api                   # the longest matching path wins: /api/config → backend
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
