# The backend accepts traffic from the frontend, on port 8080 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: backend                   # the Pods this policy protects
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend          # who may connect
      ports:
        - protocol: TCP
          port: 8080                 # to which port
