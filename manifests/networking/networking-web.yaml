# Two web Pods, a ClusterIP Service in front of them, and a NodePort Service for traffic from outside the cluster.
# Lesson 21 explains every line.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web                    # inside the cluster: http://web (same namespace) or web.net-lab.svc.cluster.local
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport           # from outside: http://<node IP>:30080
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080          # a fixed port in the node range 30000-32767
