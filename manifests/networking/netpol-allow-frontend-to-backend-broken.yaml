# The frontend-to-backend rule with a typo in a label. Lesson 22, Break It.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: backend                   # the Pods this policy protects
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fronted           # a typo: no Pod has this label
      ports:
        - protocol: TCP
          port: 8080                 # to which port
