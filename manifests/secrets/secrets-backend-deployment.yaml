# The backend receives the password twice, to show both ways (lesson 12):
# as an environment variable (DB_PASSWORD) and as a file (DB_PASSWORD_FILE, which the backend prefers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: learning-app/backend:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_PASSWORD_FILE
              value: /etc/db/password
          volumeMounts:
            - name: db-credentials
              mountPath: /etc/db
              readOnly: true
      volumes:
        - name: db-credentials
          secret:
            secretName: db-credentials
            items:
              - key: password
                path: password
