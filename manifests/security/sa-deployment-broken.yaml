# A Deployment that names a ServiceAccount nobody created. Lesson 23, Break It.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exporter
  template:
    metadata:
      labels:
        app: exporter
    spec:
      serviceAccountName: exporter   # no ServiceAccount of this name exists in the namespace
      containers:
        - name: shell
          image: alpine:3.23
          command: ["sleep", "86400"]
