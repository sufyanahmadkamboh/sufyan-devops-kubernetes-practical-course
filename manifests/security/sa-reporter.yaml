# A workload identity, and a Pod that uses it. Lesson 23 explains every line.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
---
apiVersion: v1
kind: Pod
metadata:
  name: reporter
spec:
  serviceAccountName: reporter     # the Pod acts as system:serviceaccount:<namespace>:reporter
  containers:
    - name: shell
      image: alpine:3.23
      command: ["sleep", "86400"]
