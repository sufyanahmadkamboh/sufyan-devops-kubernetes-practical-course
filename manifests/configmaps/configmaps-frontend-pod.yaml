# Nginx with its page and site configuration mounted from the ConfigMap frontend-files (lesson 11).
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  containers:
    - name: nginx
      image: nginx:1.30-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html
        - name: site
          mountPath: /etc/nginx/conf.d
  volumes:
    - name: page
      configMap:
        name: frontend-files
        items:
          - key: index.html
            path: index.html
    - name: site
      configMap:
        name: frontend-files
        items:
          - key: default.conf
            path: default.conf
