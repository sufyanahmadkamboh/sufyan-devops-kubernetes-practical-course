# Lesson 07: four Pods with labels for application, environment and tier.
apiVersion: v1
kind: Pod
metadata:
  name: web-dev
  labels: {app: web, environment: dev, tier: frontend}
  annotations:
    team: "web-team@example.com"
    description: "nginx for the development environment"
spec:
  containers: [{name: web, image: nginx:1.30-alpine}]
---
apiVersion: v1
kind: Pod
metadata:
  name: web-prod
  labels: {app: web, environment: prod, tier: frontend}
spec:
  containers: [{name: web, image: nginx:1.30-alpine}]
---
apiVersion: v1
kind: Pod
metadata:
  name: api-dev
  labels: {app: api, environment: dev, tier: backend}
spec:
  containers: [{name: api, image: learning-app/backend:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: api-prod
  labels: {app: api, environment: prod, tier: backend}
spec:
  containers: [{name: api, image: learning-app/backend:1.0.0}]
