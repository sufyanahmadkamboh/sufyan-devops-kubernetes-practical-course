# A Pod that tolerates the taint lab=demo:NoSchedule, so it may run on a node that carries it (lesson 16).
apiVersion: v1
kind: Pod
metadata:
  name: tolerant
spec:
  tolerations:
    - key: lab
      operator: Equal
      value: demo
      effect: NoSchedule
  containers:
    - name: web
      image: nginx:1.30-alpine
