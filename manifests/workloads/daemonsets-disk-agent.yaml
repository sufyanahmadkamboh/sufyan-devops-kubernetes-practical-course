# An agent meant only for nodes labelled lab=agents. Lesson 18, Break It.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: disk-agent
spec:
  selector:
    matchLabels:
      app: disk-agent
  template:
    metadata:
      labels:
        app: disk-agent
    spec:
      nodeSelector:
        lab: agents                         # only nodes with this label
      containers:
        - name: agent
          image: busybox:1.37
          env:
            - name: NODE_NAME             # the node this Pod runs on, filled in by Kubernetes
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - while true; do echo "agent on $NODE_NAME sees $(ls /host/var/log/pods | wc -l) Pod log folders"; sleep 30; done
          volumeMounts:
            - name: pod-logs
              mountPath: /host/var/log/pods
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
      volumes:
        - name: pod-logs
          hostPath:                       # a folder of the node itself, not of the Pod
            path: /var/log/pods
            type: Directory
