# A Pod whose container fails at start-up and is restarted again and again (CrashLoopBackOff): lesson 27.
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  labels:
    app: crasher
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo 'starting the report service'; echo 'error: /etc/app/app.conf: no such file' >&2; exit 1"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 16Mi
