{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "learning-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  index.html: |
    <!doctype html>
    <html><head><title>{{ .Values.frontend.title }}</title></head>
    <body><h1>{{ .Values.frontend.title }}</h1><p>The API is at <a href="/api/">/api/</a>.</p></body></html>
  default.conf: |
    server {
      listen 80;
      location / { root /usr/share/nginx/html; }
      location /api/ { proxy_pass http://{{ .Release.Name }}-backend/; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "learning-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "learning-app.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "learning-app.selector" (dict "root" . "component" "frontend") | nindent 8 }}
      annotations:
        # the page changes with the title: a new checksum restarts the Pods so they read the new ConfigMap
        checksum/config: {{ .Values.frontend.title | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.frontend.image }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: site
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: site
          configMap:
            name: {{ .Release.Name }}-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "learning-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "learning-app.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
{{- end }}
